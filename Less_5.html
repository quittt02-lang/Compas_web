<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>
<body>
    <form id="regis"> 
        <input type = "text" name = "login" placeholder="Введите логин"><br><br>
        <input type = "password" name = "password" placeholder="Введите пароль"><br><br>
        <button type="submit">Зарегестрироваться</button>
    </form>
    <script>
        const form = document.getElementById('regis');
        
        form.addEventListener("submit", function(event){
            event.preventDefault();
            let password = form.elements.password.value;
            
            let bigLetter = false;
            let number = false;
            let symbol = false;

            for(let i =0; i < password.length; i++){
                if(password[i]>='A' && password[i] <= 'Z'){
                    bigLetter = true;
                }
                if(password[i]>= '0' && password[i]<= '9'){
                    number = true;
                }
                if ("!@#$%^&*".includes(password[i])){
                    symbol = true;
                }
            }
            if (password.length<8 || bigLetter === false || number === false || symbol === false){
                alert("Пароль не соответсвует требованиям");
                return;
            }
            alert("Пароль подходит");
        });

    </script>
    
</body>
</html>
