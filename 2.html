<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Document</title>
    <link href="./12.css" rel="stylesheet" type="text/css"/>
</head>
<body>
    <a href="1.html" class="nav-link">На главную</a>
    <a href="12.html" class="div-link div-btn">На главную</a>
    <form>
        <label for="username">Имя пользователя:</label><br>
        <input type="text" id="username" name="username"><br>
        
        <label for="pwd">Пароль:</label><br>
        <input type="password" id="pwd" name="pwd"><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br>
        
        <label for="avatar">Фотография:</label>
        <input type="file" id="avatar" name="avatar" accept="image/*"><br>
        
        <label>Выбор пола:</label><br>
        <input type="radio" id="man" value="man" name="group">
        <label for="man">Мужской</label><br>
        
        <input type="radio" id="woman" value="woman" name="group">
        <label for="woman">Женский</label><br>
    
        <p>Согласие на рассылку:</p>

        <input type="checkbox" id="r_email" name="r_email" value="b_email">
        <label for="r_email">Согласен на рассылку</label><br> 
        
        <input type="checkbox" id="c_date" name="c_date" value="b_date">
        <label for="c_date">Согласен на обработку данных</label><br> 
        
    </form> 
    <script> 
    let username = document.getElementById("username");
    let password = document.getElementById("pwd");
    let Email = document.getElementById("email");

    username.style.backgroundColor = "lightblue";
    password.style.backgroundColor = "lightblue";
    Email.style.backgroundColor = "lightblue";

    username.style.color = "black";
    password.style.color ="black";
    Email.style.color ="black";

    username.style.border = "2px solid blue";
    password.style.border = "2px solid blue";
    Email.style.border = "2px solid blue";




    </script>
</body>
</html>
